<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Luigi Ezequiel</title>
</head>
<body>
    <header>
        <h1>Entre em contato</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Voltar ao Início</a></li>
            <li><a href="about.html">Sobre Mim</a></li>
        </ul>
    </nav>
    <main>
        <section>
         <h2>Contato</h2>
         <p>Entre em contato comigo preenchendo o formulário abaixo:</p>

         <form>
            <fieldset>
                <legend>Informações para Contato</legend>
                
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br>
                
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone"><br>

            </fieldset>

            <fieldset>
                <legend>Mensagem</legend>
                
                <label for="mensagem">Mensagem:</label><br>
                <textarea id="mensagem" name="mensagem" rows="5" required></textarea><br>

                <label for="assunto">Assunto:</label><br>
                <select id="assunto" name="assunto" required>
                    <option value="">Selecione um assunto</option>
                    <option value="duvida">Dúvida</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="reclamacao">Reclamação</option>
                </select>

            </fieldset>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Luigi Ezequiel. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
